services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.production
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - default
      - stack_appnet

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env.production
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - default
      - stack_appnet

  worker:
    build:
      context: .
      dockerfile: workers/pitch-analyzer/Dockerfile
    env_file: .env.production
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env.production
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/var/lib/redis/data
    command: redis-server --appendonly yes
    restart: unless-stopped

networks:
  stack_appnet:
    external: true

volumes:
  postgres_data:
  redis_data:
