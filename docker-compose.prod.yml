services:
  api:
    image: ghcr.io/pawelgawliczek/intonavio/api:latest
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - default
      - stack_appnet

  worker:
    image: ghcr.io/pawelgawliczek/intonavio/worker:latest
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3G

  stem-splitter:
    image: ghcr.io/pawelgawliczek/intonavio/stem-splitter:latest
    env_file: .env.production
    environment:
      YOUTUBE_COOKIES_FILE: /run/secrets/youtube-cookies.txt
    volumes:
      - ./youtube-cookies.txt:/run/secrets/youtube-cookies.txt:ro
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env.production
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/var/lib/redis/data
    command: redis-server --appendonly yes
    restart: unless-stopped

networks:
  stack_appnet:
    external: true

volumes:
  postgres_data:
  redis_data:
