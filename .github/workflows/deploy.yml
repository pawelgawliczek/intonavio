name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

# ─── Deployment configuration ─────────────────────────────────
# To deploy, set these GitHub repository secrets:
#   DEPLOY_HOST      — SSH hostname or IP of production server
#   DEPLOY_USER      — SSH username
#   DEPLOY_SSH_KEY   — SSH private key
#   DEPLOY_PATH      — Absolute path to docker-compose.yml on server
#   HEALTH_CHECK_URL — Full URL to GET for post-deploy verification

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - { name: api, context: '.', dockerfile: apps/api/Dockerfile }
          - {
              name: worker,
              context: './workers/pitch-analyzer',
              dockerfile: workers/pitch-analyzer/Dockerfile,
            }
          - {
              name: stem-splitter,
              context: './workers/stem-splitter',
              dockerfile: workers/stem-splitter/Dockerfile,
            }
          # - { name: web, context: '.', dockerfile: apps/web/Dockerfile }  # Not yet implemented

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest,${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST || secrets.HOSTINGER_HOST }}
          username: ${{ secrets.DEPLOY_USER || secrets.HOSTINGER_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY || secrets.HOSTINGER_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull api worker stem-splitter
            docker compose up -d --remove-orphans
            sleep 10
            docker exec intonavio-api-1 npx prisma migrate deploy
            sleep 5
            curl -sf ${{ secrets.HEALTH_CHECK_URL }} || exit 1
            docker logs --tail 5 intonavio-worker-1 2>&1 || echo "Warning: could not read worker logs"
